<g class="n ext"><rect class="box" x="30" y="90" width="190" height="120" rx="5"/>
<text class="nt" x="40" y="109">Source</text>
<text class="ns" x="40" y="124">tb_alu_fifo · valid / ready</text>
<text class="nl" x="40" y="138">in_valid, in_op, in_a, in_b</text>
<text class="nl" x="40" y="152">holds a stalled command unchanged</text>
</g>
<g class="n"><rect class="box" x="260" y="90" width="290" height="80" rx="5"/>
<text class="nt" x="270" y="109">Source-side handshake</text>
<text class="ns" x="270" y="124">assign · in_ready, in_push</text>
<text class="nl" x="270" y="138">in_ready = !in_full</text>
<text class="nl" x="270" y="152">in_push = in_valid &amp;&amp; in_ready</text>
</g>
<g class="n"><rect class="box" x="260" y="200" width="290" height="110" rx="5"/>
<text class="nt" x="270" y="219">Pointers and flags</text>
<text class="ns" x="270" y="234">u_in_fifo · wr_ptr, rd_ptr</text>
<text class="nl" x="270" y="248">4-bit pointers (3 + wrap bit)</text>
<text class="nl" x="270" y="262">empty = wr_ptr == rd_ptr</text>
<text class="nl" x="270" y="276">full = low bits equal, wrap bits differ</text>
</g>
<g class="n"><rect class="box" x="260" y="340" width="290" height="120" rx="5"/>
<text class="nt" x="270" y="359">Input storage</text>
<text class="ns" x="270" y="374">u_in_fifo · mem[DEPTH], 35 bits</text>
<text class="nl" x="270" y="388">entry = {op, a, b}</text>
<text class="nl" x="270" y="402">write at wr_ptr on push, read at rd_ptr</text>
<text class="nl" x="270" y="416">dout valid whenever not empty</text>
</g>
<g class="n"><rect class="box" x="600" y="90" width="250" height="90" rx="5"/>
<text class="nt" x="610" y="109">Transfer rule</text>
<text class="ns" x="610" y="124">assign · xfer</text>
<text class="nl" x="610" y="138">xfer = !in_empty &amp;&amp; !out_full</text>
<text class="nl" x="610" y="152">in_pop = out_push = xfer</text>
</g>
<g class="n"><rect class="box" x="600" y="210" width="250" height="130" rx="5"/>
<text class="nt" x="610" y="229">ALU</text>
<text class="ns" x="610" y="244">alu · combinational</text>
<text class="nl" x="610" y="258">ADD SUB AND OR XOR SLL SRL SLTU</text>
<text class="nl" x="610" y="272">sum, diff are 17-bit (carry bit)</text>
<text class="nl" x="610" y="286">shift amount = b[3:0]</text>
</g>
<g class="n"><rect class="box" x="600" y="370" width="250" height="90" rx="5"/>
<text class="nt" x="610" y="389">Flag logic</text>
<text class="ns" x="610" y="404">assign · res_flags {N, Z, C, V}</text>
<text class="nl" x="610" y="418">N = y[15]   Z = (y == 0)</text>
<text class="nl" x="610" y="432">C = alu_c   V = alu_v</text>
</g>
<g class="n"><rect class="box" x="900" y="200" width="290" height="110" rx="5"/>
<text class="nt" x="910" y="219">Pointers and flags</text>
<text class="ns" x="910" y="234">u_out_fifo · wr_ptr, rd_ptr</text>
<text class="nl" x="910" y="248">same logic as the input FIFO</text>
<text class="nl" x="910" y="262">empty = wr_ptr == rd_ptr</text>
<text class="nl" x="910" y="276">full = low bits equal, wrap bits differ</text>
</g>
<g class="n"><rect class="box" x="900" y="340" width="290" height="120" rx="5"/>
<text class="nt" x="910" y="359">Output storage</text>
<text class="ns" x="910" y="374">u_out_fifo · mem[DEPTH], 20 bits</text>
<text class="nl" x="910" y="388">entry = {N, Z, C, V, y}</text>
<text class="nl" x="910" y="402">dout valid whenever not empty</text>
</g>
<g class="n"><rect class="box" x="900" y="90" width="290" height="80" rx="5"/>
<text class="nt" x="910" y="109">Sink-side handshake</text>
<text class="ns" x="910" y="124">assign · out_valid, out_pop</text>
<text class="nl" x="910" y="138">out_valid = !out_empty</text>
<text class="nl" x="910" y="152">out_pop = out_valid &amp;&amp; out_ready</text>
</g>
<g class="n ext"><rect class="box" x="1240" y="90" width="230" height="120" rx="5"/>
<text class="nt" x="1250" y="109">Sink</text>
<text class="ns" x="1250" y="124">tb_alu_fifo · valid / ready</text>
<text class="nl" x="1250" y="138">out_valid, out_y, out_flags</text>
<text class="nl" x="1250" y="152">out_ready on some cycles</text>
</g>
<g class="n ext ver"><rect class="box" x="1240" y="260" width="230" height="110" rx="5"/>
<text class="nt" x="1250" y="279">Scoreboard</text>
<text class="ns" x="1250" y="294">tb_alu_fifo · ref_alu, exp_q</text>
<text class="nl" x="1250" y="308">independent reference model</text>
<text class="nl" x="1250" y="322">compares every delivered {flags, y}</text>
</g>
<g class="n ext ver"><rect class="box" x="260" y="560" width="940" height="80" rx="5"/>
<text class="nt" x="270" y="579">alu_fifo_checker, sync_fifo_checker (bind)</text>
<text class="ns" x="270" y="594">verif/*_checker.sv · 15 assertions · 34 cover bins</text>
<text class="nl" x="270" y="608">handshake rules, flag consistency, latency, conservation; two FIFO instances each checked black-box</text>
</g>
<path class="ln t-data" d="M16 710 L42 710" marker-end="url(#a-data)"/>
<text class="lg" x="50" y="714">Command / result data</text>
<path class="ln t-ctl" d="M198 710 L224 710" marker-end="url(#a-ctl)"/>
<text class="lg" x="232" y="714">Handshake &amp; control</text>
<path class="ln t-ver" d="M367 710 L393 710" marker-end="url(#a-ver)"/>
<text class="lg" x="401" y="714">Verification only</text>
<text class="lg" x="1488" y="714" text-anchor="end">Open the interactive explorer to run scenarios through the design</text>
</svg>
