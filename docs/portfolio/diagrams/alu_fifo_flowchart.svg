   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="381.6" y="127.067227" transform="rotate(-0 381.6 127.067227)">in_valid &amp;&amp; !in_full ?</text>
   </g>
   <g id="text_5">
