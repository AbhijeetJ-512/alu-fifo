   <g id="text_21">
    <text style="font-style: italic; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(28.8 575.757312)">The two FIFO decisions (push and xfer) and the pop decision are all evaluated in the same cycle; an input push and a transfer can both happen.</text>
    <text style="font-style: italic; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(28.8 585.405139)">Back-pressure: a full output FIFO stops xfer, the input FIFO then fills, and in_ready falls - nothing is dropped or reordered.</text>
    <text style="font-style: italic; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(28.8 595.052966)">Latency: a command pushed in cycle t is at the head of u_in_fifo in t+1 (first-word fall-through), and its result is visible in u_out_fifo in t+2.</text>
   </g>
