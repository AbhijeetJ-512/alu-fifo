   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="381.6" y="288.682617" transform="rotate(-0 381.6 288.682617)">ALU computes y, c, v from the head</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="381.6" y="299.420098" transform="rotate(-0 381.6 299.420098)">op selects ADD..SLTU; flags N,Z,C,V derived</text>
   </g>
