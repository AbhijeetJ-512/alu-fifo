    <text style="font-weight: 700; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="129.6" y="209.785811" transform="rotate(-0 129.6 209.785811)">Hold: nothing moves</text>
